name: Release

# Publishes a version. Pushing a tag like v0.1.0 starts it. Running it by hand from the Actions tab
# rehearses everything except pushing the image and creating the release. See docs/releasing.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

# Least privilege by default. Only the publish job below is granted more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything CI checks, on the exact commit being released. The publish job does not start unless it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read the version and check it
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match the version in package.json (${version}). Run npm version ${GITHUB_REF_NAME#v} --no-git-tag-version, commit, and tag again."
            exit 1
          fi
          if ! awk -v v="${version}" 'index($0, "## [" v "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}. Move the Unreleased entries into a section headed ## [${version}] - YYYY-MM-DD."
            exit 1
          fi

      # The files attached to the release next to the image: the deck schema, the Claude skill as a zip, and their
      # checksums. Built on a rehearsal too, so the step is exercised before a real tag, and checked two ways: against
      # the checksums, and by a zip program that is not ours reading the skill back.
      - name: Package the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/package-release-assets.ts --out release-assets --version "${VERSION}"
          cd release-assets
          sha256sum -c SHA256SUMS
          unzip -t "tessera-deck-skill-${VERSION}.zip"
          unzip -Z1 "tessera-deck-skill-${VERSION}.zip" | grep -qx 'tessera-deck/SKILL.md'
          ls -l

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Release candidates (a version with a - suffix) get only their exact tag. Stable versions also get
      # major.minor and latest. A rehearsal gets a throwaway tag and is never pushed.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=rehearsal,enable=${{ github.ref_type != 'tag' }}

      - name: Build for amd64 and arm64${{ github.ref_type == 'tag' && ' and push' || ' (rehearsal, not pushed)' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          # Signed statements of how and from what the image was built, stored next to it in the registry.
          provenance: mode=max
          sbom: true

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The release notes are this version's section of the changelog.
          # Plain string matching, so a dot in the version is a dot and not "any character".
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::The changelog section for ${VERSION} is empty."; exit 1; }
          flags=""
          case "${VERSION}" in *-*) flags="--prerelease" ;; esac
          # The release carries the schema, the skill zip, and the checksums, so each can be verified after download.
          gh release create "${GITHUB_REF_NAME}" --title "Tessera ${VERSION}" --notes-file notes.md --verify-tag ${flags} \
            release-assets/tessera-deck.v1.schema.json \
            "release-assets/tessera-deck-skill-${VERSION}.zip" \
            release-assets/SHA256SUMS
