name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this on the commit it is about to publish.
  workflow_call:

# Least privilege. No job writes to the repository or publishes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A clean install on a runner with no extra build tools. Install scripts are off (ADR-007).
      - run: npm ci
      # Type check, lint, format check, schema drift check, unit and integration tests.
      - run: npm run verify
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Check production licenses
        run: npm run licenses
      - name: Build and smoke test the Node server
        run: |
          npm run build
          npm run smoke
      # Real-browser tests: XSS corpus, the import and study flows, layout at phone widths, themes.
      # Locally these use the installed Chrome. Here Playwright downloads its own Chromium.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Import benchmark (5,000 cards, 10 second budget)
        run: npm run benchmark
      # Adversarial requests against the real server (headers, CSP, CSRF, limits, injection, log hygiene).
      - name: Security probe
        run: npm run security:probe
      # Hard kills, restarts, and parallel writes against the real server and its SQLite file.
      - name: Durability check
        run: npm run durability
      # Runs the backup command from docs/operations.md as written, restores it, and checks every error
      # message in the troubleshooting table.
      - name: Operations guide check
        run: npm run ops:check

  # The same browser tests in Firefox and in WebKit (the engine of Safari), each on its own server and an empty
  # data folder. Chromium runs in the verify job. This is separate so the three browsers do not share one time
  # budget, and so the verify job and this one run at the same time. QA risk R-1.
  browsers:
    name: Browser tests in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the test browser and its system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests in ${{ matrix.browser }}
        run: npm run test:e2e:${{ matrix.browser }}

  docker:
    name: Docker ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node runs the smoke script on the runner against the container.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up QEMU for arm64 emulation
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        run: >
          docker buildx build
          --platform ${{ matrix.platform }}
          --load
          --build-arg VERSION=ci
          --build-arg REVISION=${{ github.sha }}
          --tag tessera:ci
          .

      - name: Check the image (non-root user, size budget)
        run: |
          docker image inspect tessera:ci --format 'architecture: {{.Architecture}}  uncompressed bytes: {{.Size}}'
          uid=$(docker run --rm --platform ${{ matrix.platform }} --entrypoint id tessera:ci -u)
          echo "runs as uid: $uid"
          test "$uid" = "1000"
          bytes=$(docker save tessera:ci | gzip -1 | wc -c)
          echo "compressed image bytes (approximate): $bytes"
          # ADR-004 budget: under 150 MB compressed.
          test "$bytes" -lt 157286400

      # Known vulnerabilities in the image: the operating system packages and the npm packages that ship in it.
      # It fails on anything HIGH or CRITICAL that has a fix available (ignore-unfixed), so a failure always asks
      # for something that can be done: rebuild on a newer base image, or update a dependency. Both architectures are
      # built from the same packages, so one scan is enough. See docs/releasing.md (security finding S-05).
      - name: Scan the image for known vulnerabilities
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tessera:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Start the container with the same hardening as compose.yaml
        run: |
          docker volume create tessera-ci-data
          docker run -d --name tessera --platform ${{ matrix.platform }} \
            --init --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3000:3000 \
            -v tessera-ci-data:/data \
            tessera:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then echo "up after ${i} tries"; exit 0; fi
            sleep 2
          done
          docker logs tessera
          exit 1

      - name: Smoke test the running container
        run: node scripts/smoke.ts --base http://127.0.0.1:3000

      - name: Docker reports the container healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tessera)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker logs tessera
          exit 1

      - name: Shuts down gracefully on SIGTERM
        run: |
          docker stop -t 20 tessera
          code=$(docker inspect -f '{{.State.ExitCode}}' tessera)
          echo "exit code: $code"
          docker logs tessera 2>&1 | grep -q "shutting down"
          test "$code" = "0"

      - name: Data survives a restart
        run: |
          docker start tessera
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/decks | grep -q '"ccna-ospf"'

      - name: Container logs
        if: always()
        run: docker logs tessera || true
