name: CI

on:
  # Planning notes under .10x change no code, so they do not start a run (and do not cancel one that is running).
  push:
    branches: [main]
    paths-ignore: ['.10x/**']
  pull_request:
    paths-ignore: ['.10x/**']
  # The release workflow calls this with scope "image" to check the image it is about to publish. Everything else
  # was already checked by the push run on the same commit (see release.yml).
  workflow_call:
    inputs:
      scope:
        description: 'all, or image to run only the container checks'
        type: string
        default: all

# Least privilege. No job writes to the repository or publishes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks that used to be one job called Verify, now five jobs that run at the same time (about a minute
  # each instead of three and a half in a row). `npm run verify` is still the local command for the first three.
  static:
    name: Static checks
    if: inputs.scope != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A clean install on a runner with no extra build tools. Install scripts are off (ADR-007).
      - run: npm ci
      - name: Type check (the app and the service worker)
        run: npm run check
      - name: Lint and format check
        run: npm run lint
      - name: Deck schema drift check
        run: npm run schema:check

  unit:
    name: Unit tests
    if: inputs.scope != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A clean install on a runner with no extra build tools. Install scripts are off (ADR-007).
      - run: npm ci
      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests
    if: inputs.scope != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A clean install on a runner with no extra build tools. Install scripts are off (ADR-007).
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  server:
    name: Server checks
    if: inputs.scope != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A clean install on a runner with no extra build tools. Install scripts are off (ADR-007).
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Check production licenses
        run: npm run licenses
      - name: Build and smoke test the Node server
        run: |
          npm run build
          npm run smoke
      - name: Import benchmark (5,000 cards, 10 second budget)
        run: npm run benchmark
      - name: Statistics benchmark (100,000 reviews, 1 second budget)
        run: npm run benchmark:stats

  security:
    name: Security and durability
    if: inputs.scope != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A clean install on a runner with no extra build tools. Install scripts are off (ADR-007).
      - run: npm ci
      - run: npm run build
      # Adversarial requests against the real server (headers, CSP, CSRF, limits, injection, log hygiene).
      - name: Security probe
        run: npm run security:probe
      # The same probe in its remote mode (used by the live-image harness): no check may go missing or turn
      # into a pass without running.
      - name: Security probe, remote mode
        run: npm run probe:remote-check
      # Hard kills, restarts, and parallel writes against the real server and its SQLite file.
      - name: Durability check
        run: npm run durability
      # Runs the backup command from docs/operations.md as written, restores it, and checks every error
      # message in the troubleshooting table.
      - name: Operations guide check
        run: npm run ops:check

  # One name for "everything that is not a browser or a container passed". It stays called Verify so anything that
  # waits on that check keeps working, and it fails if any of the five jobs above failed or was cancelled.
  verify:
    name: Verify
    if: always() && inputs.scope != 'image'
    needs: [static, unit, integration, server, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All five passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: ${RESULTS}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  # The browser tests (XSS corpus, the import and study flows, layout at phone widths, themes, accessibility) in
  # Chromium, Firefox, and WebKit (the engine of Safari). Each browser's suite is split into shards, and every shard
  # is its own job on its own runner with its own server and an empty data folder, so the specs (which import decks
  # with fixed ids) never meet each other's data. WebKit is about 2.5 times slower than Chromium, so it gets eight
  # shards and the other two get four. The suite took 13 minutes in WebKit on one runner. QA risk R-1.
  browsers:
    name: ${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards || 4 }}
    if: inputs.scope != 'image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2, 3, 4]
        include:
          - { browser: webkit, shard: 1, shards: 8 }
          - { browser: webkit, shard: 2, shards: 8 }
          - { browser: webkit, shard: 3, shards: 8 }
          - { browser: webkit, shard: 4, shards: 8 }
          - { browser: webkit, shard: 5, shards: 8 }
          - { browser: webkit, shard: 6, shards: 8 }
          - { browser: webkit, shard: 7, shards: 8 }
          - { browser: webkit, shard: 8, shards: 8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser files Playwright downloads, kept between runs. They are named by Playwright's version, so a new
      # version downloads fresh ones. The system libraries (apt) are still installed by the next step every time.
      - name: Keep the downloaded browsers between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install the test browser and its system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests in ${{ matrix.browser }}, shard ${{ matrix.shard }} of ${{ matrix.shards || 4 }}
        run: npm run test:e2e:${{ matrix.browser }} -- --shard=${{ matrix.shard }}/${{ matrix.shards || 4 }}

  docker:
    name: Docker ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The arm64 image is built under emulation, which takes four minutes, so a push builds and tests only amd64.
        # The release (scope image) checks both: arm64 is what gets published for the Raspberry Pi class of host.
        platform: ${{ fromJSON(inputs.scope == 'image' && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node runs the smoke script on the runner against the container.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up QEMU for arm64 emulation
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        run: >
          docker buildx build
          --platform ${{ matrix.platform }}
          --load
          --build-arg VERSION=ci
          --build-arg REVISION=${{ github.sha }}
          --tag tessera:ci
          .

      - name: Check the image (non-root user, size budget)
        run: |
          docker image inspect tessera:ci --format 'architecture: {{.Architecture}}  uncompressed bytes: {{.Size}}'
          uid=$(docker run --rm --platform ${{ matrix.platform }} --entrypoint id tessera:ci -u)
          echo "runs as uid: $uid"
          test "$uid" = "1000"
          bytes=$(docker save tessera:ci | gzip -1 | wc -c)
          echo "compressed image bytes (approximate): $bytes"
          # ADR-004 budget: under 150 MB compressed.
          test "$bytes" -lt 157286400

      # Known vulnerabilities in the image: the operating system packages and the npm packages that ship in it.
      # Two steps, so a failure says what kind it is. The scan writes its result to a file and does not fail on
      # findings (it fails only if the scanner itself cannot run, for example if its database cannot be downloaded).
      # The check reads the file, prints every finding as a log line and a GitHub annotation, and fails on anything
      # HIGH or CRITICAL that has a fix available, so a failure always asks for something that can be done: rebuild
      # on a newer base image, or update a dependency. Both architectures are built from the same packages, so one
      # scan is enough. See docs/releasing.md (security finding S-05).
      - name: Scan the image for known vulnerabilities
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tessera:ci
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Check the scan result
        if: matrix.platform == 'linux/amd64'
        run: node scripts/check-image-scan.ts trivy-results.json

      - name: Start the container with the same hardening as compose.yaml
        run: |
          docker volume create tessera-ci-data
          docker run -d --name tessera --platform ${{ matrix.platform }} \
            --init --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3000:3000 \
            -v tessera-ci-data:/data \
            tessera:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then echo "up after ${i} tries"; exit 0; fi
            sleep 2
          done
          docker logs tessera
          exit 1

      - name: Smoke test the running container
        run: node scripts/smoke.ts --base http://127.0.0.1:3000

      - name: Docker reports the container healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tessera)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker logs tessera
          exit 1

      - name: Shuts down gracefully on SIGTERM
        run: |
          docker stop -t 20 tessera
          code=$(docker inspect -f '{{.State.ExitCode}}' tessera)
          echo "exit code: $code"
          docker logs tessera 2>&1 | grep -q "shutting down"
          test "$code" = "0"

      - name: Data survives a restart
        run: |
          docker start tessera
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/decks | grep -q '"ccna-ospf"'

      - name: Container logs
        if: always()
        run: docker logs tessera || true
